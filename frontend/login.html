<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava - Učenje risanja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            margin: 20px;
        }
        .auth-header {
            color: white;
            padding: 30px;
            text-align: center;
        }
        .auth-header i {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .auth-body {
            padding: 30px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            border: none;
            padding: 12px;
            font-weight: 500;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .alert {
            border-radius: 10px;
        }
        .password-toggle {
            cursor: pointer;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
        .password-wrapper {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header bg-primary">
            <i class="bi bi-palette-fill"></i>
            <h2 class="mb-0">Učenje risanja</h2>
            <h5 class="mt-3 mb-0">Prijava</h5>
        </div>
        
        <div class="auth-body">
            <div id="alertContainer"></div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginUsername" class="form-label">
                        <i class="bi bi-person"></i> Uporabniško ime
                    </label>
                    <input type="text" class="form-control" id="loginUsername" required>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">
                        <i class="bi bi-lock"></i> Geslo
                    </label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="loginPassword" required>
                        <i class="bi bi-eye password-toggle" id="toggleLoginPassword"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 bg-primary">
                    <i class="bi bi-box-arrow-in-right"></i> Prijava
                </button>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
