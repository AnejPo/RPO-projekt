<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osnovno Canvas Risanje</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-palette-fill me-2"></i>
                Canvas Risalnik
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-4">
        <!-- Canvas Card -->
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">
                            <i class="bi bi-brush-fill text-primary me-2"></i>
                            Risalna površina
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <!-- Toolbar -->
                        <div class="toolbar mb-3 p-3 bg-light rounded">
                            <div class="row g-3 align-items-center">
                                <div class="col-auto">
                                    <button id="clearBtn" class="btn btn-danger">
                                        <i class="bi bi-trash"></i> Pobriši
                                    </button>
                                </div>
                                <div class="col-auto">
                                    <button id="undoBtn" class="btn btn-warning">
                                        <i class="bi bi-arrow-counterclockwise"></i> Razveljavi
                                    </button>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-0 me-2">Debelina: </label>
                                    <input type="range" class="form-range d-inline-block"
                                           style="width: 120px; vertical-align: middle;"
                                           id="brushSize" min="1" max="20" value="2">
                                    <span id="brushSizeValue" class="badge bg-secondary ms-2">2px</span>
                                </div>
                                <div class="col-auto">
                                    <label class="form-label mb-0 me-2">Barva:</label>
                                    <input type="color" class="form-control form-control-color d-inline-block"
                                           style="width: 60px;"
                                           id="brushColor" value="#000000">
                                </div>
                            </div>
                        </div>
                         <!-- Canvas -->
                        <div class="canvas-wrapper">
                            <canvas id="drawingCanvas" width="800" height="600"></canvas>
                        </div>
                        <!-- Export Buttons -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                            <button id="confirmDrawingBtn" class="btn btn-success">
                                <i class="bi bi-send me-2"></i>
                                Oddaj sliko
                            </button>
                            <button id="exportSvgBtn" class="btn btn-info">
                                <i class="bi bi-download me-2"></i>
                                Izvozi sliko
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
